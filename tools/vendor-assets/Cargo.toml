[package]
name = "smia-vendor-assets"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
malm-archive = { path = "../../../malm/crates/malm-archive" }
malm-tree = { path = "../../../malm/crates/malm-tree" }
malm-types = { path = "../../../malm/crates/malm-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
